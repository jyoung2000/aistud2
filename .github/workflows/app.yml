name: Build double-click app

# Builds the single-file, no-dependencies Neuclip Studio app for every OS and attaches it
# to a GitHub Release. No Rust/Tauri — just Python + Node, so it's fast and reliable.
#
#   git tag v0.1.0 && git push origin v0.1.0
# Then download the app for your OS from the Release and double-click it.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: Neuclip-Studio-macOS-AppleSilicon
          - os: macos-13
            asset: Neuclip-Studio-macOS-Intel
          - os: windows-latest
            asset: Neuclip-Studio-Windows
          - os: ubuntu-22.04
            asset: Neuclip-Studio-Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build single-file app
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt pyinstaller pywebview
          python sidecar/build_app.py

      - name: Package (macOS .app)
        if: startsWith(matrix.os, 'macos')
        run: |
          cd sidecar/dist
          ditto -c -k --keepParent "Neuclip Studio.app" "../../${{ matrix.asset }}.zip"

      - name: Package (Windows)
        if: startsWith(matrix.os, 'windows')
        run: |
          Compress-Archive -Path "sidecar/dist/Neuclip Studio.exe" -DestinationPath "${{ matrix.asset }}.zip"

      - name: Package (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd sidecar/dist
          zip "../../${{ matrix.asset }}.zip" "Neuclip Studio"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}.zip

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset }}.zip
          draft: true
          name: "Neuclip Studio ${{ github.ref_name }}"

  # GPU build: Windows exe with CUDA PyTorch bundled — double-click activates the NVIDIA GPU,
  # no install. Large (~4-5 GB) and shipped as a folder (onedir) so launch stays fast.
  build-gpu-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build GPU app (CUDA torch bundled)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt pyinstaller pywebview
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
          python sidecar/build_app.py --gpu

      - name: Package (Windows GPU folder)
        run: |
          Compress-Archive -Path "sidecar/dist/Neuclip Studio GPU" -DestinationPath "Neuclip-Studio-Windows-GPU.zip"

      - name: Upload GPU build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Neuclip-Studio-Windows-GPU
          path: Neuclip-Studio-Windows-GPU.zip

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Neuclip-Studio-Windows-GPU.zip
          draft: true
          name: "Neuclip Studio ${{ github.ref_name }}"
