name: Build desktop app + installers

# Builds the fast-launching (onedir) Neuclip Studio app for every OS and wraps it the way
# each platform expects: a Windows setup wizard (Inno Setup — progress bar, Start menu,
# uninstaller, .neuclip file association), a macOS drag-to-Applications DMG, and a Linux
# tarball. No Rust/Tauri — just Python + Node.
#
#   git tag v0.1.0 && git push origin v0.1.0
# Then download the installer for your OS from the draft Release.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: Neuclip-Studio-macOS-AppleSilicon
          - os: macos-13
            asset: Neuclip-Studio-macOS-Intel
          - os: windows-latest
            asset: Neuclip-Studio-Windows-Setup
          - os: ubuntu-22.04
            asset: Neuclip-Studio-Linux
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build app (onedir — fast launch)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt pyinstaller pywebview pillow
          python sidecar/build_app.py

      # --- Windows: a real setup wizard -------------------------------------------
      - name: Build installer (Inno Setup)
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\windows.iss
          Move-Item "installer\out\Neuclip-Studio-Setup.exe" "${{ matrix.asset }}.exe"

      # --- macOS: drag-to-Applications DMG -----------------------------------------
      - name: Build DMG
        if: startsWith(matrix.os, 'macos')
        run: |
          mkdir -p dmgroot
          cp -R "sidecar/dist/Neuclip Studio.app" dmgroot/
          ln -s /Applications dmgroot/Applications
          hdiutil create -volname "Neuclip Studio" -srcfolder dmgroot -ov -format UDZO "${{ matrix.asset }}.dmg"

      # --- Linux: tarball of the onedir folder --------------------------------------
      - name: Package (Linux)
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          cd sidecar/dist
          tar czf "../../${{ matrix.asset }}.tar.gz" "Neuclip Studio"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.exe
            ${{ matrix.asset }}.dmg
            ${{ matrix.asset }}.tar.gz
          if-no-files-found: error

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.asset }}.exe
            ${{ matrix.asset }}.dmg
            ${{ matrix.asset }}.tar.gz
          draft: true
          name: "Neuclip Studio ${{ github.ref_name }}"

  # GPU build: Windows with CUDA PyTorch bundled — the NVIDIA GPU works on double-click.
  # Large (~4-5 GB): shipped as an installer AND a portable zip (the zip skips the
  # long installer-compression step for people who just want the folder).
  build-gpu-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
        working-directory: frontend

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build GPU app (CUDA torch bundled)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r sidecar/requirements.txt pyinstaller pywebview pillow
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cu124
          python sidecar/build_app.py --gpu

      - name: Build GPU installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            "/DAppSrc=..\sidecar\dist\Neuclip Studio GPU" "/DAppEdition= GPU" installer\windows.iss
          Move-Item "installer\out\Neuclip-Studio-Setup GPU.exe" "Neuclip-Studio-Windows-GPU-Setup.exe"

      - name: Package portable zip
        run: |
          Compress-Archive -Path "sidecar/dist/Neuclip Studio GPU" -DestinationPath "Neuclip-Studio-Windows-GPU.zip"

      - name: Upload GPU build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Neuclip-Studio-Windows-GPU
          path: |
            Neuclip-Studio-Windows-GPU-Setup.exe
            Neuclip-Studio-Windows-GPU.zip
          if-no-files-found: error

      - name: Attach to Release (on tag)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Neuclip-Studio-Windows-GPU-Setup.exe
            Neuclip-Studio-Windows-GPU.zip
          draft: true
          name: "Neuclip Studio ${{ github.ref_name }}"
